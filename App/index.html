<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>syidddproject Search</title>
<style>
:root{--bg:#fff;--fg:#202124;--mut:#70757a;--bd:#dfe1e5;--ac:#4285f4}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--mut:#9aa0a6;--bd:#5f6368;--ac:#8ab4f8}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:-apple-system,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
h1{font-size:48px;margin:0 0 28px;font-weight:600;letter-spacing:-1px}
h1 span{color:var(--ac)}
form{width:100%;max-width:600px}
.box{display:flex;border:1px solid var(--bd);border-radius:28px;padding:4px 6px 4px 18px}
input[type=search]{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:17px;padding:10px 0;min-width:0}
button{border:0;background:var(--ac);color:#fff;border-radius:22px;padding:0 20px;font-size:15px;cursor:pointer}
.eng{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.eng label{border:1px solid var(--bd);border-radius:16px;padding:6px 14px;font-size:14px;color:var(--mut)}
.eng input{display:none}
.eng input:checked+span{color:var(--ac);font-weight:600}
#tabs{width:100%;max-width:600px;margin-top:26px;display:none}
#tabs h2{font-size:14px;color:var(--mut);font-weight:500;margin:0 0 8px}
.tc{display:flex;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.tc .t{flex:1;min-width:0;cursor:pointer}.tc b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc small{color:var(--mut)}.tc i{font-style:normal;color:var(--mut);padding:4px 8px;cursor:pointer}
.opt{margin-top:18px;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center}
footer{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));font-size:13px;color:var(--mut)}
</style></head><body>
<h1>syiddd<span>project</span></h1>
<form id="f">
<div class="box"><input id="q" type="search" placeholder="Telusuri di web atau ketik URL" autofocus autocapitalize="off" autocorrect="off"><button>Cari</button></div>
<div class="eng" id="eng"></div>
</form>
<div id="tabs"><h2>Tab terbuka</h2><div id="tl"></div></div>
<label class="opt"><input type="checkbox" id="sw" checked> Tampilkan tab di beranda</label>
<footer>© syidddproject</footer>
<script>
var E={Google:"https://www.google.com/search?q=",Bing:"https://www.bing.com/search?q=",DuckDuckGo:"https://duckduckgo.com/?q=",Brave:"https://search.brave.com/search?q=",Yahoo:"https://search.yahoo.com/search?p="};
var cur=localStorage.getItem("e")||"Google",box=document.getElementById("eng");
Object.keys(E).forEach(function(n){var l=document.createElement("label");l.innerHTML='<input type="radio" name="e" '+(n==cur?"checked":"")+'><span>'+n+'</span>';l.firstChild.onchange=function(){cur=n;try{localStorage.setItem("e",n)}catch(e){}};box.appendChild(l)});
document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var v=document.getElementById("q").value.trim();if(!v)return;
if(/^(https?:\/\/)/i.test(v))location.href=v;
else if(/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(v))location.href="https://"+v;
else location.href=E[cur]+encodeURIComponent(v)};

function post(m){try{webkit.messageHandlers.native.postMessage(m)}catch(e){}}
var sw=document.getElementById("sw"),tb=document.getElementById("tabs"),tl=document.getElementById("tl");
sw.onchange=function(){post({a:"toggle",v:sw.checked})};
window.setTabs=function(list,show){sw.checked=show;tl.innerHTML="";
list.forEach(function(t){var d=document.createElement("div");d.className="tc";
var c=document.createElement("div");c.className="t";var b=document.createElement("b");b.textContent=t.title;var m=document.createElement("small");m.textContent=t.url;c.appendChild(b);c.appendChild(m);
c.onclick=function(){post({a:"switch",id:t.id})};
var x=document.createElement("i");x.textContent="✕";x.onclick=function(){post({a:"close",id:t.id})};
d.appendChild(c);d.appendChild(x);tl.appendChild(d)});
tb.style.display=(show&&list.length)?"block":"none"};
post({a:"ready"});
</script></body></html>
